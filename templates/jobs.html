<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="utf-8">
    <title>Job List</title>
</head>
<body>

    <h1>求人一覧</h1>

    <ul>
        {% for job in jobs %}
            <li>
                <!-- 求人詳細ページへのリンク -->
                <a href="/job/{{ job._id }}">
                    {{ job.job_title_raw }} / {{ job.company_name }}
                </a>
                <br>

                <!-- 補足情報 -->
                カテゴリ：{{ job.job_category }} |
                リモート：{{ job.remote_type }} |
                年収：{{ job.salary.min }} 〜 {{ job.salary.max }} 万円
            </li>
        {% endfor %}
    </ul>

</body>
</html>
