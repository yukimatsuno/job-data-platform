<!-- jobs.html -->
<!-- 一覧ページ用テンプレート例 -->
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Job List</title>
</head>
<body>
    <h1>Job List</h1>
    <ul>
        {% for job in jobs %}
        <li><a href="/jobs/{{ job['id'] }}">{{ job['title'] }}</a></li>
        {% endfor %}
    </ul>
</body>
</html>
